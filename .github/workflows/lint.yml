name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bicep:
    name: Bicep build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure CLI version
        run: az --version
      - name: Bicep upgrade
        run: az bicep upgrade
      - name: Build main.bicep
        run: az bicep build --file infra/aks/main.bicep
      - name: Build main.bicepparam
        run: az bicep build-params --file infra/aks/main.bicepparam
      - name: Lint
        run: az bicep lint --file infra/aks/main.bicep

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze deploy.ps1
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path infra/aks/deploy.ps1 -Recurse -Severity @('Error','Warning')
          if ($r) { $r | Format-Table -AutoSize; exit 1 } else { Write-Host 'PSScriptAnalyzer clean.' }

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck infra/aks/deploy.sh

  accessibility:
    name: Wizard accessibility (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --directory infra/aks > /tmp/http-server.log 2>&1 &
      - name: Wait for server
        run: |
          for i in {1..20}; do
            if curl -sSf http://127.0.0.1:4173/wizard/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "wizard server failed to start"
          cat /tmp/http-server.log || true
          exit 1
      - name: Run axe-core CLI
        run: |
          npx --yes @axe-core/cli http://127.0.0.1:4173/wizard/index.html --exit
