name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bicep:
    name: Bicep build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure CLI version
        run: az --version
      - name: Bicep upgrade
        run: az bicep upgrade
      - name: Build main.bicep
        run: az bicep build --file infra/aks/main.bicep
      - name: Build main.bicepparam
        run: az bicep build-params --file infra/aks/main.bicepparam
      - name: Lint
        run: az bicep lint --file infra/aks/main.bicep

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze deploy.ps1
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path infra/aks/deploy.ps1 -Recurse -Severity @('Error','Warning')
          if ($r) { $r | Format-Table -AutoSize; exit 1 } else { Write-Host 'PSScriptAnalyzer clean.' }

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck infra/aks/deploy.sh
