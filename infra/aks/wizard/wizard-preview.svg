<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AKS Deployment Wizard Preview</title>
  <desc id="desc">Preview illustration of the five-step AKS deployment wizard with generated command outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf5ff" />
      <stop offset="100%" stop-color="#f9fbff" />
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8f2ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="url(#bg)" />

  <rect x="48" y="44" width="1104" height="78" rx="12" fill="url(#hero)" stroke="#dbe7fb" />
  <rect x="48" y="44" width="6" height="78" fill="#0f6cbd" rx="3" />
  <text x="72" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#0f172a" font-weight="700">AKS Optional/BYO Wizard</text>
  <text x="72" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Guided 5-step deployment command generator for AKS Automatic</text>

  <rect x="48" y="142" width="1104" height="494" rx="12" fill="#ffffff" stroke="#dbe7fb" />

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="78" y="172" width="190" height="34" rx="17" fill="#0f6cbd" />
    <text x="96" y="194" fill="#ffffff">1. Basics</text>

    <rect x="284" y="172" width="190" height="34" rx="17" fill="#e8f7ee" stroke="#8fd8a8" />
    <text x="302" y="194" fill="#0f6b3f">2. Network</text>

    <rect x="490" y="172" width="190" height="34" rx="17" fill="#f4f8ff" stroke="#bcd3f5" />
    <text x="508" y="194" fill="#23496d">3. Platform</text>

    <rect x="696" y="172" width="190" height="34" rx="17" fill="#f4f8ff" stroke="#bcd3f5" />
    <text x="714" y="194" fill="#23496d">4. BYO + Advanced</text>

    <rect x="902" y="172" width="220" height="34" rx="17" fill="#f4f8ff" stroke="#bcd3f5" />
    <text x="920" y="194" fill="#23496d">5. Output Commands</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">
    <text x="80" y="240">Subscription</text>
    <rect x="80" y="248" width="500" height="38" rx="8" fill="#ffffff" stroke="#bdd2f3" />

    <text x="80" y="326">Location</text>
    <rect x="80" y="334" width="240" height="38" rx="8" fill="#ffffff" stroke="#bdd2f3" />

    <text x="340" y="326">Workload Name</text>
    <rect x="340" y="334" width="240" height="38" rx="8" fill="#ffffff" stroke="#bdd2f3" />

    <text x="80" y="412">Mode</text>
    <rect x="80" y="420" width="240" height="38" rx="8" fill="#ffffff" stroke="#bdd2f3" />

    <text x="340" y="412">Hub Connectivity</text>
    <rect x="340" y="420" width="240" height="38" rx="8" fill="#ffffff" stroke="#bdd2f3" />
  </g>

  <rect x="612" y="232" width="510" height="374" rx="10" fill="#f8fbff" stroke="#dbe7fb" />
  <text x="632" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#004578" font-weight="700">Generated Commands</text>

  <g font-family="Consolas, monospace" font-size="12" fill="#0f172a">
    <rect x="632" y="284" width="470" height="126" rx="8" fill="#ffffff" stroke="#cfe0fb" />
    <text x="646" y="307">.\deploy.ps1 -SubscriptionId 0000... -Location westus3</text>
    <text x="646" y="327">-Mode automaticPrivate -HubConnectivityMode peering</text>
    <text x="646" y="347">-Overrides @{ deployBastion='true'; deployJumpbox='true' }</text>

    <rect x="632" y="426" width="470" height="126" rx="8" fill="#ffffff" stroke="#cfe0fb" />
    <text x="646" y="449">az deployment sub create --location westus3</text>
    <text x="646" y="469">--template-file infra/aks/main.bicep</text>
    <text x="646" y="489">--parameters mode=automaticPrivate hubConnectivityMode=peering</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="632" y="568" width="108" height="34" rx="8" fill="#0f6cbd" />
    <text x="654" y="590" fill="#ffffff" font-weight="700">Copy PS</text>

    <rect x="752" y="568" width="112" height="34" rx="8" fill="#334155" />
    <text x="772" y="590" fill="#ffffff" font-weight="700">Copy CLI</text>

    <rect x="874" y="568" width="98" height="34" rx="8" fill="#0f6cbd" />
    <text x="898" y="590" fill="#ffffff" font-weight="700">Next</text>

    <rect x="982" y="568" width="120" height="34" rx="8" fill="#a4262c" />
    <text x="1004" y="590" fill="#ffffff" font-weight="700">Reset</text>
  </g>
</svg>
